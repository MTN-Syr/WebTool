<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, shrink-to-fit=no">
  <title>MTN Syria | كتيب الخدمات التدريبي</title>
  <meta name="description" content="كتيب التدريب التعريفي بخدمات MTN Syria للموظفين الجدد">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="MTN_Logo.png">
  <link rel="apple-touch-icon" href="MTN_Logo.png">
</head>
<body>
  <a class="skip-link" href="#main">تخطي إلى المحتوى</a>

  <!-- ===== Header ===== -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="brand" data-i18n-aria="ariaBrand" aria-label="MTN Syria - الرئيسية">
        <span class="brand-mark"><img src="MTN_Logo.png" alt="MTN" class="brand-logo"></span>
        <span class="brand-text">
          <span class="brand-title" data-i18n="brandTitle">كتيب الخدمات التدريبي</span>
          <span class="brand-sub">Syria</span>
        </span>
      </a>

      <div class="header-actions">
        <button id="searchToggle" class="icon-btn" data-i18n-aria="ariaSearch" aria-label="بحث" title="بحث">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <button id="themeToggle" class="icon-btn" data-i18n-aria="ariaTheme" aria-label="تبديل الوضع الليلي" title="الوضع الليلي">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
<button id="langToggle" class="icon-btn lang-btn" data-i18n-aria="ariaLang" aria-label="English" title="English">EN</button>
    </div>
  </div>
</header>

  <!-- ===== Mobile category bar ===== -->
  <div class="mobile-cat-bar" id="mobileCatBar">
    <button id="mobileCatToggle" class="icon-btn" data-i18n-aria="openMenu" aria-label="فتح قائمة التصنيفات">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <nav id="mobileCatNav" class="mobile-chips"></nav>
  </div>

  <!-- ===== Search Overlay ===== -->
  <div id="searchOverlay" class="search-overlay" hidden>
    <div class="search-box">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="search" placeholder="ابحث عن خدمة..." data-i18n="searchPlaceholder" data-i18n-placeholder="searchPlaceholder" autocomplete="off">
      <button id="searchClose" class="icon-btn" data-i18n="ariaClose" aria-label="إغلاق">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="searchResults" class="search-results"></div>
  </div>

  <!-- ===== Layout ===== -->
  <div class="layout container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="التصنيفات">
      <div class="sidebar-title">
        <span data-i18n="categoriesTitle">التصنيفات</span>
        <span id="serviceCount" class="count-pill">0</span>
      </div>
      <nav id="categoryNav" class="category-nav"></nav>
    </aside>

    <!-- Main -->
    <main id="main" class="main">
      <div id="appContent"></div>
    </main>
  </div>

  <!-- ===== Footer ===== -->
  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> MTN Syria — <span >UAT & Trainig</span></p>
      <p class="footer-hint" >Osama Shams Aldeen</p>
    </div>
  </footer>

  <!-- ===== Scripts ===== -->
  <script src="data/services/index.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
